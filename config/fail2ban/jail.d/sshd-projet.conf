# J1 — bannissement des adresses qui accumulent les échecs SSH.
# Lu après defaults-debian.conf (ordre alphabétique) : ces valeurs l'emportent.
[sshd]
enabled  = true
# Debian 13 n'a plus /var/log/auth.log : lecture directe du journal systemd
backend  = systemd
# Compte aussi les déconnexions avant authentification : avec la clé obligatoire,
# les lignes « Failed password » n'apparaissent plus
mode     = aggressive
# 3 échecs en 10 minutes => bannissement de 15 minutes
maxretry = 3
findtime = 10m
bantime  = 15m
# Récidive : durée doublée à chaque fois, jusqu'à 1 jour
bantime.increment = true
bantime.maxtime   = 1d
ignoreip = 127.0.0.1/8 ::1
