# Bonus — modules du noyau inutiles sur ce serveur : chargement impossible.
# ANSSI R10 appliquée en partie : interdire TOUT chargement de module (modules_disabled)
# empêcherait nftables et fail2ban de charger leurs propres modules à la demande.
# « install X /bin/false » : une demande de chargement de X lance /bin/false et échoue.

# Protocoles réseau jamais utilisés ici, qui ont connu des failles du noyau
# (par exemple CVE-2017-6074 dans DCCP : un utilisateur pouvait devenir root)
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false

# Stockage amovible (clé USB, disque FireWire) : rien à brancher sur un serveur ;
# évite la copie de données vers une clé ou l'arrivée d'un programme par ce biais
install usb-storage /bin/false
install firewire-ohci /bin/false
