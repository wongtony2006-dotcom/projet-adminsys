# Durcissement SSH du serveur Pixelia (exigences S1 à S5)
# Lu AVANT /etc/ssh/sshd_config : pour chaque option, la première valeur lue gagne.

# S1 — authentification par clé uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# S2 — connexion de root interdite
PermitRootLogin no

# S3 — seuls les membres du groupe acces_ssh
AllowGroups acces_ssh

# S4 — 3 essais au plus par connexion, 30 s pour s'authentifier
MaxAuthTries 3
LoginGraceTime 30

# S4 — inactivité
# Session sans aucun trafic pendant 15 min : tous ses canaux sont fermés
ChannelTimeout global=15m
# Connexion sans canal ouvert (par exemple après le délai ci-dessus) : fermée après 5 min
UnusedConnectionTimeout 5m
# Client qui ne répond plus (réseau coupé) : déconnecté après 2 x 300 s
ClientAliveInterval 300
ClientAliveCountMax 2

# Réduction de la surface d'attaque
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
LogLevel VERBOSE

# Bonus — algorithmes cryptographiques, d'après ssh-audit (audits/) et le guide ANSSI
# OpenSSH. Sur les valeurs par défaut d'OpenSSH 10.0, ssh-audit signale : les courbes
# NIST (ecdh-sha2-nistp*, clé d'hôte ECDSA), SHA-1 (hmac-sha1*), les MAC à étiquette de
# 64 bits (umac-64*) et les MAC « encrypt-and-MAC » (sans -etm). Ils sont retirés.
# Échange de clés : hybride post-quantique (ML-KEM, NTRU Prime) ou Curve25519
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
# Intégrité : SHA-2 ou UMAC-128, calculés sur le message chiffré (encrypt-then-MAC)
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
# Clés du serveur : Ed25519 et RSA 3072 bits ; la clé ECDSA n'est plus chargée
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
# Clé RSA d'un utilisateur : 3072 bits au moins (1024 par défaut)
RequiredRSASize 3072

# OpenSSH 10 bloque un moment une adresse qui multiplie les connexions sans
# s'authentifier. Les tests de verifier.sh se connectent en local et échouent exprès :
# la boucle locale est exemptée, comme dans la jail fail2ban (ignoreip).
PerSourcePenaltyExemptList 127.0.0.1,::1
