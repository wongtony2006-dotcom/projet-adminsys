# Bonus R28 — /tmp (un tmpfs sous Debian 13) : on reprend les options de
# /usr/lib/systemd/system/tmp.mount et on ajoute noexec.
# nosuid : bits SUID ignorés ; nodev : fichiers de périphérique ignorés ;
# noexec : aucun programme ne peut être lancé depuis /tmp, où tout le monde écrit.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%%,nr_inodes=1m
