# Bonus — paramètres du noyau recommandés par l'ANSSI (guide BP-028 v2.0, R9 à R14).
# Appliqués à chaque démarrage par systemd-sysctl. Les fichiers sont lus par ordre
# alphabétique et la DERNIÈRE valeur l'emporte : nommé 99-zz-… pour passer après
# 50-default.conf (systemd) et 99-protect-links.conf (procps), qui fixent d'autres valeurs.
# « net.ipv4.conf.*.x » vise toutes les cartes réseau, y compris une carte ajoutée plus
# tard (systemd applique ces motifs à chaque nouvelle carte).

# --- R9 : noyau ---
# Journal du noyau (dmesg) réservé à root : il donne des adresses utiles à un exploit
kernel.dmesg_restrict = 1
# Adresses des fonctions du noyau masquées, même pour root (/proc/kallsyms)
kernel.kptr_restrict = 2
# Adresses aléatoires de la pile, du tas et des bibliothèques (ASLR complet)
kernel.randomize_va_space = 2
# Combinaisons « SysRq » désactivées (arrêt ou redémarrage brutal depuis le clavier)
kernel.sysrq = 0
# Programmes eBPF interdits aux utilisateurs (valeur figée jusqu'au prochain démarrage)
kernel.unprivileged_bpf_disabled = 1
# Compilateur JIT d'eBPF durci contre l'injection de code
net.core.bpf_jit_harden = 2
# perf interdit aux utilisateurs : Debian règle déjà 3, plus strict que le 2 de l'ANSSI
kernel.perf_event_paranoid = 3
# Lignes série : un utilisateur ne peut pas faire charger un module « line discipline »
dev.tty.ldisc_autoload = 0

# --- R11 : module de sécurité Yama ---
# Un processus ne peut observer (ptrace) que ses propres descendants
kernel.yama.ptrace_scope = 1

# --- R12 : réseau IPv4 ---
# Le serveur ne fait pas routeur
net.ipv4.ip_forward = 0
# Redirections ICMP ni acceptées ni envoyées : elles servent à détourner le trafic
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.shared_media = 0
# Routage imposé par l'émetteur (option « source route ») refusé
net.ipv4.conf.*.accept_source_route = 0
# Paquet rejeté s'il arrive par une carte qui ne mène pas à son adresse source
# (adresse usurpée) ; mode strict = 1
net.ipv4.conf.*.rp_filter = 1
# Paquets aux adresses impossibles (« martiens ») journalisés
net.ipv4.conf.*.log_martians = 1
# Une valeur explicite l'emporte sur un motif « * ». Or le 50-default.conf de systemd
# écrit ces deux clés pour « default » et écarte « all » de ses motifs : on les écrit donc
# aussi explicitement pour « all » et « default »
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
# ARP : ne répondre que pour une adresse de la carte interrogée, ignorer l'ARP gratuit
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.all.arp_ignore = 2
net.ipv4.conf.all.drop_gratuitous_arp = 1
# Réponses ICMP d'erreur invalides ignorées
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Ports source des connexions sortantes : au-dessus de 32768, loin des ports de services
net.ipv4.ip_local_port_range = 32768 65535
# Inondation de SYN : cookies SYN ; RFC 1337 : protège les connexions en TIME-WAIT
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# --- IPv6 (conservé : le NAT VirtualBox en fournit) ---
net.ipv6.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_source_route = 0

# --- R14 : systèmes de fichiers ---
# Pas de fichier « core » pour un programme setuid (il contiendrait des secrets)
fs.suid_dumpable = 0
# Dans /tmp (collant, modifiable par tous) : pas d'ouverture du fichier ou du tube
# d'un autre utilisateur, pas de lien symbolique ou physique piège
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
