#!/usr/sbin/nft -f
# J2 — pare-feu du serveur Pixelia : tout est refusé en entrée sauf SSH.
# PAS de « flush ruleset » : il effacerait aussi la table inet f2b-table de fail2ban.
# On ne remplace que NOTRE table : la créer (si absente), la supprimer, la recréer.
table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        type filter hook input priority filter; policy drop;

        ct state established,related accept   # réponses à nos propres connexions (apt, DNS)
        ct state invalid drop
        iif "lo" accept                        # boucle locale (tests de verifier.sh)
        tcp dport 22 ct state new accept       # SSH

        # IPv6 : sans découverte de voisins, IPv6 ne fonctionne plus du tout.
        # La VM reçoit une adresse IPv6 du NAT VirtualBox, ces messages restent donc ouverts.
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big } accept
    }

    chain transfert {
        type filter hook forward priority filter; policy drop;   # le serveur ne route pas
    }

    chain sortie {
        type filter hook output priority filter; policy accept;
    }
}
